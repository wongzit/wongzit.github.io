    <!-- ====================================================================
         COMPOUNDS
         One <div class="cas-card"> per compound. Copy a block to add more.

         • 3D preview: the <div class="cas-card__viewer"> shows the .xyz file
           that this card's XYZ button downloads — visitors can rotate it.
           Just put the file in assets/cas/<name>.xyz; nothing else to set.
         • Badge: use class "xrd" for a single-crystal structure, or "calc"
           for a QM-optimized structure — and set its label text accordingly.
         • XYZ button: downloads assets/cas/<name>.xyz (Cartesian coordinates).
           Line 1 = number of atoms, line 2 = a title, then "El  x  y  z" in Å.
         ==================================================================== -->
    <div class="cas-grid">

      <div class="cas-card">
        <span class="cas-badge xrd">SCXRD</span>
        <div class="cas-card__viewer" role="img" aria-label="Rotatable 3D structure"></div>
        <div class="cas-card__body">
          <p class="cas-card__name">2,2'-(naphthalene-1,8-diyl)dibenzaldehyde</p>
          <p class="cas-card__meta">CAS 2762747-19-1</p>
          <div class="cas-card__links">
            <a href="assets/cas/2762747-19-1.xyz" download>XYZ</a>
            <a href="https://www.ccdc.cam.ac.uk/structures/Search?Ccdcid=2574022" target="_blank" rel="noopener">CCDC</a>
            <a href="https://doi.org/10.1039/d6cc05316e" target="_blank" rel="noopener">DOI</a>
          </div>
        </div>
      </div>

      <div class="cas-card">
        <span class="cas-badge xrd">SCXRD</span>
        <div class="cas-card__viewer" role="img" aria-label="Rotatable 3D structure"></div>
        <div class="cas-card__body">
          <p class="cas-card__name">ZAWPIB</p>
          <p class="cas-card__meta">CCDC 2563561</p>
          <div class="cas-card__links">
            <a href="assets/cas/2563561.xyz" download>XYZ</a>
            <a href="https://www.ccdc.cam.ac.uk/structures/Search?Ccdcid=2563561" target="_blank" rel="noopener">CCDC</a>
            <a href="https://doi.org/10.1039/d6cc05316e" target="_blank" rel="noopener">DOI</a>
          </div>
        </div>
      </div>

      <!-- Example: QM-optimized structure only -->
      <div class="cas-card">
        <span class="cas-badge calc">QM</span>
        <div class="cas-card__viewer" role="img" aria-label="Rotatable 3D structure"></div>
        <div class="cas-card__body">
          <p class="cas-card__name">Compound name / label</p>
          <p class="cas-card__meta">CAS 000000-00-0</p>
          <div class="cas-card__links">
            <a href="assets/cas/compound-2.xyz" download>XYZ</a>
            <a href="#" target="_blank" rel="noopener">DOI</a>
          </div>
        </div>
      </div>

      <div class="cas-card">
        <span class="cas-badge calc">QM</span>
        <div class="cas-card__viewer" role="img" aria-label="Rotatable 3D structure"></div>
        <div class="cas-card__body">

          <p class="cas-card__meta">CAS 000000-00-0</p>
          <div class="cas-card__links">
            <a href="assets/cas/compound-3.xyz" download>XYZ</a>
            <a href="#" target="_blank" rel="noopener">DOI</a>
          </div>
        </div>
      </div>

    </div>
