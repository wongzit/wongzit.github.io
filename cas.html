    <!-- ====================================================================
         COMPOUNDS
         One <div class="cas-card"> per compound. Copy a block to add more.

         • Preview: an animated .gif (e.g. a rotating molecule) in
           assets/img/cas/<name>.gif
         • Badge: use class "xrd" for a single-crystal structure, or "calc"
           for a QM-optimized structure — and set its label text accordingly.
         • XYZ button: downloads assets/cas/<name>.xyz (Cartesian coordinates).
           Put the matching .xyz file there; the "download" attribute saves it.
         ==================================================================== -->
    <div class="cas-grid">

      <!-- Example: published WITH a single-crystal structure -->
      <div class="cas-card">
        <span class="cas-badge xrd">SCXRD</span>
        <img class="cas-card__img" src="assets/img/cas/compound-1.gif" alt="Crystal structure animation"
             onerror="this.style.opacity=.25">
        <div class="cas-card__body">
          <p class="cas-card__name">Compound name / label</p>
          <p class="cas-card__meta">CAS 000000-00-0</p>
          <div class="cas-card__links">
            <a href="assets/cas/compound-1.xyz" download>XYZ</a>
            <a href="https://www.ccdc.cam.ac.uk/structures/Search?Ccdcid=0000000" target="_blank" rel="noopener">CCDC</a>
            <a href="#" target="_blank" rel="noopener">DOI</a>
          </div>
        </div>
      </div>

      <!-- Example: QM-optimized structure only -->
      <div class="cas-card">
        <span class="cas-badge calc">QM</span>
        <img class="cas-card__img" src="assets/img/cas/compound-2.gif" alt="Optimized structure animation"
             onerror="this.style.opacity=.25">
        <div class="cas-card__body">
          <p class="cas-card__name">Compound name / label</p>
          <p class="cas-card__meta">CAS 000000-00-0</p>
          <div class="cas-card__links">
            <a href="assets/cas/compound-2.xyz" download>XYZ</a>
            <a href="#" target="_blank" rel="noopener">DOI</a>
          </div>
        </div>
      </div>

      <div class="cas-card">
        <span class="cas-badge calc">QM</span>
        <img class="cas-card__img" src="assets/img/cas/compound-3.gif" alt="Optimized structure animation"
             onerror="this.style.opacity=.25">
        <div class="cas-card__body">
          <p class="cas-card__name">Compound name / label</p>
          <p class="cas-card__meta">CAS 000000-00-0</p>
          <div class="cas-card__links">
            <a href="assets/cas/compound-3.xyz" download>XYZ</a>
            <a href="#" target="_blank" rel="noopener">DOI</a>
          </div>
        </div>
      </div>

    </div>
