  <title>Publications · Zhe WANG</title>
  <link rel="stylesheet" href="assets/css/style.css?v=14">
</head>
<body>
  <div id="site-header"></div>

  <main class="container reading" style="max-width:900px">
    <div class="page-head">
      <div class="kicker">// publications</div>
      <h1>Publications</h1>
      <p class="lead">公表論文</p>
    </div>

    <!-- ====================================================================
         METRICS  —  "publications" auto-fills from your data. Edit the
         h-index, i10-index, citations and the "Updated" date below by hand
         (these come from Google Scholar, which has no public API).
         ==================================================================== -->
    <div class="pub-metrics">
      <div class="pub-metric"><div class="pub-metric__n" id="m-pubs">—</div><div class="pub-metric__l">publications</div></div>
      <div class="pub-metric"><div class="pub-metric__n">9</div><div class="pub-metric__l">h-index</div></div>
      <div class="pub-metric"><div class="pub-metric__n">9</div><div class="pub-metric__l">i10-index</div></div>
      <div class="pub-metric"><div class="pub-metric__n">204</div><div class="pub-metric__l">citations</div></div>
    </div>
    <p class="pub-metrics__note">Updated 2026-08-18 · source:
      <a href="https://scholar.google.com/citations?user=gzUh6CMAAAAJ">Google Scholar</a></p>

    <hr class="divider">

    <!-- This nav row is the same on all publication pages (only the
         "active" class moves). -->
    <p class="pub-nav"><b>List by Type:</b>
      <a href="publications.html" class="active">all</a><span class="sep">/</span>
      <a href="papers.html">original papers</a><span class="sep">/</span>
      <a href="reviews.html">accounts &amp; reviews</a><span class="sep">/</span>
      <a href="covers.html">cover pictures</a>
    </p>
    <p class="pub-nav" id="pub-year-nav"></p>

    <input id="pub-filter" class="pub-filter" type="search" placeholder="Type to filter…">

    <div id="pub-list"></div>
  </main>

  <div id="site-footer"></div>

  <!-- Optional metric badges: show automatically for any entry that has a real "doi". -->
  <script async src="https://badge.dimensions.ai/badge.js"></script>

  <script src="data/publications.js?v=14"></script>
  <script src="assets/js/site.js?v=14"></script>
  <script src="assets/js/pubs.js?v=14"></script>
  <script>renderPublications(["paper", "review"]);</script>
</body>
</html>
