<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="/assets/img/favicon/favicon.svg">
  <link rel="icon" type="image/png" href="/assets/img/favicon/favicon.png">
  <title>Publications · Zhe WANG</title>
  <link rel="stylesheet" href="assets/css/style.css?v=31">
</head>
<body>
  <div id="site-header"></div>

  <main class="container reading">
    <div class="page-head">
      <div class="kicker">// publications</div>
      <h1>Publications</h1>
      <p class="lead">公表論文</p>
    </div>

    <!-- ====================================================================
         METRICS  —  "publications" auto-fills from your data. Edit the
         h-index, i10-index, citations and the "Updated" date below by hand
         (these come from Google Scholar, which has no public API).
         ==================================================================== -->
    <div class="pub-metrics">
      <div class="pub-metric"><div class="pub-metric__n" id="m-pubs">—</div><div class="pub-metric__l">publications</div></div>
      <div class="pub-metric"><div class="pub-metric__n">9</div><div class="pub-metric__l">h-index</div></div>
      <div class="pub-metric"><div class="pub-metric__n">9</div><div class="pub-metric__l">i10-index</div></div>
      <div class="pub-metric"><div class="pub-metric__n">215</div><div class="pub-metric__l">citations</div></div>
    </div>
    <p class="pub-metrics__note">Updated 2026-11-06 · source:
      <a href="https://scholar.google.com/citations?user=gzUh6CMAAAAJ">Google Scholar</a></p>

    <hr class="divider">

    <p class="pub-nav" id="pub-type-nav"></p>   <!-- filled from the publications menu in site.js -->
    <!-- Search box + year and sort pull-downs (pubs.js fills in the menus) + Export button. -->
    <div class="pub-toolbar">
      <input id="pub-filter" class="pub-filter" type="search" placeholder="Search by title, author, journal or year" aria-label="Search publications">
      <select id="pub-year" class="pub-select" aria-label="Publication year"></select>
      <select id="pub-sort" class="pub-select" aria-label="Sort order"></select>
      <!-- Export to Word: opens the panel built by assets/js/pubexport.js -->
      <button id="pub-export" class="pub-export-btn" type="button" aria-haspopup="dialog" title="Export the list as a Word file">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
        Export
      </button>
    </div>

    <div id="pub-list"></div>
  </main>

  <div id="site-footer"></div>

  <!-- Optional metric badges: show automatically for any entry that has a real "doi". -->
  <script async src="https://badge.dimensions.ai/badge.js"></script>
  <script async src="https://d1bxh8uas1mnw7.cloudfront.net/assets/embed.js"></script>

  <script src="data/publications.js?v=31"></script>
  <script src="assets/js/site.js?v=31"></script>
  <script src="data/team.js"></script>
  <script src="assets/js/team.js?v=31"></script>
  <script src="assets/js/pubs.js?v=31"></script>
  <script src="assets/js/pubexport.js?v=31"></script>
  <script>renderPublications(["paper", "review"]);</script>
</body>
</html>
